; A config file in INI (.ini, .cfg). Each key is section.key; every value is text,
; and a schema's int or bool still checks a value that reads as one.

[app]
name    = my-service
version = 1.0.0
env     = production
debug   = false

[server]
host    = 0.0.0.0
port    = 8080
workers = 4
timeout = 30

[database]
host     = prod-db.internal
port     = 5432
name     = myapp
user     = app-user
; Vault's value is written instead when the file's schema marks database.password @secret().
password = @secret(secret/myapp/db#password)
pool     = 20
ssl      = true

[cache]
host = redis.internal
port = 6379
db   = 0
ttl  = 3600

[logging]
level  = info
format = json
