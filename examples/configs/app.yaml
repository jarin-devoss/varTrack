# A config file in YAML. It passes examples/schemas/app.yaml.cue.
#
# varTrack reads it at the pushed commit and flattens it to dotted keys
# (app.name, server.port, feature_flags.dark_mode, …), which is what the schema
# checks and what a key-per-value sink (Redis, ZooKeeper) stores. A sink that keeps
# the file as one document (MongoDB, S3) keeps it nested, with its numbers and
# booleans.
#
# "@secret(mount/path#field)" is replaced with Vault's value before anything is
# written, for a field the schema marks @secret() (database.password, auth.jwt_secret).
# A field the schema does not mark keeps the text as it is.

app:
  name: my-service
  version: "1.0.0"
  log_level: info
  debug: false

server:
  host: "0.0.0.0"
  port: 8080
  timeout: 30s
  max_connections: 1000

database:
  host: prod-db.internal
  port: 5432
  name: myapp
  pool_size: 20
  password: "@secret(secret/myapp/db#password)"

cache:
  host: redis.internal
  port: 6379
  ttl: 3600

auth:
  jwt_algorithm: HS256
  jwt_expiry: 86400
  jwt_secret: "@secret(secret/myapp/auth#jwt_secret)"

feature_flags:
  new_dashboard: true
  beta_api:      false
  dark_mode:     true
