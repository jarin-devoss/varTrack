version: 2

# One pull request per ecosystem each week, merged when CI is green. An update is offered
# only after it has been out for four days, so a release that is pulled the next day is
# never proposed (security updates are not delayed). Every directory that builds something
# that ships, or the tools that check it, is listed.
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 4
    groups:
      actions:
        patterns: ["*"]

  # Go. The gateway builds against libs/go through a replace, and libs/go is built into
  # vartrack-bundle, so the modules move together; tools/cue pins the cue binary the
  # orchestrator image and CI build.
  - package-ecosystem: "gomod"
    directories:
      - "/libs/go"
      - "/gateway-service"
      - "/watcher-service"
      - "/cli"
      - "/tools/cue"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 4
    groups:
      go:
        patterns: ["*"]

  # Python. Both locks of the orchestrator (requirements.txt for the image, requirements-dev.txt
  # for CI) are updated in the same pull request.
  - package-ecosystem: "pip"
    directories:
      - "/orchestrator-service"
      - "/e2e/init"
      - "/demo/seed"
      - "/docs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 4
    groups:
      python:
        patterns: ["*"]

  # The web UI
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 4
    groups:
      ui:
        patterns: ["*"]

  # Base images, by digest. A new Python or Node line is a decision of its own, so only
  # its digests and patch releases are proposed.
  - package-ecosystem: "docker"
    directories:
      - "/gateway-service"
      - "/watcher-service"
      - "/orchestrator-service/docker"
      - "/ui"
      - "/e2e/init"
      - "/e2e/gitea"
      - "/demo/seed"
      - "/demo/gitea"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 4
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]
