name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict all jobs to read-only by default; jobs that need write access
# declare their own permissions block.
permissions:
  contents: read

jobs:
  # ── Shared Go module (libs/go) ──────────────────────────────────────────────
  # The gateway and the watcher both build against it. Its generated stubs are
  # committed, so this job fails when proto/ changed and buf generate was not run.
  libs-go:
    name: libs/go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/go
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: libs/go/go.mod
          cache-dependency-path: libs/go/go.sum

      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}

      - name: Generate proto
        working-directory: .
        run: buf generate

      - name: Generated code is current
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- libs/go/gen)" ]; then
            git status --short -- libs/go/gen
            git diff --stat -- libs/go/gen
            echo "::error::libs/go/gen is out of date: run buf generate and commit the result"
            exit 1
          fi

      - name: Tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Lint (go vet)
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 120s

  # ── Gateway Service (Go) ────────────────────────────────────────────────────
  gateway:
    name: gateway-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-service
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: gateway-service/go.mod
          cache-dependency-path: |
            gateway-service/go.sum
            libs/go/go.sum

      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}

      - name: Generate proto
        working-directory: .
        run: buf generate

      - name: Tidy
        run: go mod tidy && git diff --exit-code go.sum

      - name: Lint (go vet)
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -timeout 120s -coverprofile=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: gateway-service/coverage.out
          flags: gateway-service
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Watcher Service (Go) ────────────────────────────────────────────────────
  watcher:
    name: watcher-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watcher-service
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: watcher-service/go.mod
          cache-dependency-path: |
            watcher-service/go.sum
            libs/go/go.sum

      - name: Tidy
        run: go mod tidy && git diff --exit-code go.sum

      - name: Lint (go vet)
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -timeout 120s -coverprofile=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: watcher-service/coverage.out
          flags: watcher-service
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Orchestrator Service (Python) ───────────────────────────────────────────
  orchestrator:
    name: orchestrator-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator-service
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.10"

      # The platforms' fixed values (API addresses, webhook headers) are read
      # from the generated protos, as in the image.
      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}

      - name: Generate proto
        working-directory: .
        run: buf generate

      - name: Install dependencies
        run: uv pip install --system --require-hashes -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy app --ignore-missing-imports

      - name: Test
        run: pytest -x -q --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: orchestrator-service/coverage.xml
          flags: orchestrator-service
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── CodeQL analysis ─────────────────────────────────────────────────────────
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql-config.yml

      - uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3
        if: matrix.build-mode == 'autobuild'

      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3
        with:
          category: /language:${{ matrix.language }}

  # ── Docker image builds (no push) ───────────────────────────────────────────
  docker-build:
    name: docker-build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [libs-go, gateway, watcher, orchestrator]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Go services build against the shared libs/go, so their context
          # is the repository root.
          - service: gateway-service
            context: .
            dockerfile: gateway-service/Dockerfile
          - service: watcher-service
            context: .
            dockerfile: watcher-service/Dockerfile
          - service: orchestrator-service
            context: orchestrator-service
            dockerfile: orchestrator-service/docker/Dockerfile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── E2E tests (PR only) ─────────────────────────────────────────────────────
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Start e2e stack
        working-directory: e2e
        run: |
          docker compose up --build --detach
          docker compose wait e2e-demo

      - name: Dump e2e-demo logs
        if: always()
        working-directory: e2e
        run: docker compose logs e2e-demo

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: e2e/results/
          retention-days: 7

      - name: Tear down
        if: always()
        working-directory: e2e
        run: docker compose down -v --remove-orphans

  # ── actionlint — lint the CI YAML itself ─────────────────────────────────────
  # Catches injection vulnerabilities and mistakes in workflow files before they
  # reach the runner.  No account or token needed.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Lint GitHub Actions workflows
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz \
            | tar xz actionlint
          ./actionlint -color

  # ── Trivy — scan Docker images for CVEs ─────────────────────────────────────
  # Runs after docker-build succeeds.  Uploads findings as SARIF so they appear
  # in the GitHub Security tab alongside CodeQL results.  Free, no signup.
  trivy:
    name: trivy (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Go services build against the shared libs/go, so their context
          # is the repository root.
          - service: gateway-service
            context: .
            dockerfile: gateway-service/Dockerfile
          - service: watcher-service
            context: .
            dockerfile: watcher-service/Dockerfile
          - service: orchestrator-service
            context: orchestrator-service
            dockerfile: orchestrator-service/docker/Dockerfile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image for scanning
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ── OpenSSF Scorecard (main branch only) ────────────────────────────────────
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3
        with:
          sarif_file: results.sarif

