name: Security scan

# What CI runs on every pull request after the images build (ci.yml calls this file), and what runs
# every week on main by itself: a vulnerability published after the last change is found without waiting
# for one.
#
#   trivy         each image: every fixable vulnerability goes to the Security tab; a fixable CRITICAL or HIGH fails
#   govulncheck   the Go modules, under the newest Go: reports only what the code can reach
#   fuzz          the readers of what other people send (webhook bodies, signatures, config.cue), 30 s each
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Mondays, 05:17 UTC
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  trivy:
    name: trivy (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Go services build against the shared libs/go, so their context
          # is the repository root.
          - service: gateway-service
            context: .
            dockerfile: gateway-service/Dockerfile
          - service: watcher-service
            context: .
            dockerfile: watcher-service/Dockerfile
          # The orchestrator generates its Python stubs from proto/, at the root.
          - service: orchestrator-service
            context: .
            dockerfile: orchestrator-service/docker/Dockerfile
          - service: ui
            context: ui
            dockerfile: ui/Dockerfile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image for scanning
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          # The runtime stage upgrades the distribution's packages (apk upgrade, apt-get dist-upgrade).
          # A cached layer keeps what the repository held the day it was cached, so the stage is built
          # again every time; the stages that compile and install stay cached.
          no-cache-filters: runtime

      # Every vulnerability that has a fix, of every severity, to the Security tab. (In SARIF mode the
      # action reads no `severity`, so none is given here.)
      - name: Trivy scan, for the Security tab
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          ignore-unfixed: true

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # A vulnerability that has a fix and is CRITICAL or HIGH fails the run, with the table in its log.
      # One that has no fix yet never does: nobody can act on it.
      - name: Trivy gate, no fixable CRITICAL or HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.service }}:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [libs/go, gateway-service, watcher-service, cli]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The newest Go 1.27, not the one go.mod names: the standard library is part of what is scanned,
      # and the images are built with the newest too.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}

      - name: Generate proto
        run: buf generate

      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # Not on a pull request: they take a minute each, and what they find is a bug that was there before it.
  fuzz:
    name: fuzz (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {module: libs/go, package: ./bundle, target: FuzzLoad}
          - {module: gateway-service, package: ./internal/handlers, target: FuzzValidateWebhookStream}
          - {module: gateway-service, package: ./internal/handlers, target: FuzzExtractRepoBranch}
          - {module: gateway-service, package: ./internal/handlers, target: FuzzPlatformType}
          - {module: gateway-service, package: ./internal/models/platforms, target: FuzzGitHubVerifySignature}
          - {module: gateway-service, package: ./internal/models/platforms, target: FuzzGiteaVerifySignature}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: |
            ${{ matrix.module }}/go.sum
            libs/go/go.sum

      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}

      - name: Generate proto
        run: buf generate

      # A failing input is written to testdata/fuzz/<target>/ under the module: it is in the log below, and
      # becomes a regular test once it is committed.
      # -fuzzminimizetime bounds the time Go spends shrinking an input (up to 60 s each by default, which
      # makes a 30 s run look stuck on a target that evaluates CUE).
      - name: Fuzz for 30 seconds
        working-directory: ${{ matrix.module }}
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 30s -fuzzminimizetime 5s ${{ matrix.package }}

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: ${{ matrix.module }}/**/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14
