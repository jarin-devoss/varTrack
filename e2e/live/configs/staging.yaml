# app-settings.yaml on `develop` → staging
app:
  name: checkout-api
  region: us-east-1
  env: staging

database:
  pool_size: "10"
  max_connections: "100"
  connect_timeout_ms: "5000"
  password: "@secret(secret/vartrack/configs#database.password)"

cache:
  ttl_seconds: "60"
  backend: redis

api:
  rate_limit: "1000"
  timeout_ms: "30000"
  version: v2
  secret_key: "@secret(secret/vartrack/configs#api.secret_key)"

features:
  dark_mode: "true"
  analytics: "false"
  debug_mode: "true"

observability:
  log_level: DEBUG
  service_mesh: istio
  tracing_enabled: "true"
