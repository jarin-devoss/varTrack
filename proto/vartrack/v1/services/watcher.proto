syntax = "proto3";

package vartrack.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// Watcher defines the RPC surface the watcher-service calls on the orchestrator.
// The orchestrator implements this service; the watcher is the client.
//
// Separation rationale: webhook.proto owns the gateway → orchestrator surface
// (event ingestion). This file owns the watcher → orchestrator surface
// (self-heal / drift correction).  Keeping them separate lets each service
// evolve its API independently.
service Watcher {
  // SyncDatasource triggers a full re-sync for a datasource after drift is
  // detected.  The orchestrator enqueues a Celery task and returns immediately;
  // the watcher does not wait for the task to complete.
  rpc SyncDatasource(SyncDatasourceRequest) returns (SyncDatasourceResponse) {
    option (google.api.http) = {
      post: "/v1/sync/{datasource}"
      body: "*"
    };
  }

  // Ping is a liveness check.  The watcher calls this on startup and before
  // each heal attempt to confirm the orchestrator is reachable.
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      get: "/v1/watcher/ping"
    };
  }

  // CheckDatasource compares the live state of a datasource with the desired
  // state from Git, key by key.  The watcher calls it when a poll sees the
  // datasource change, before healing: a change written by a varTrack sync
  // matches Git and needs no heal; anything else is drift.
  rpc CheckDatasource(CheckDatasourceRequest) returns (CheckDatasourceResponse) {
    option (google.api.http) = {
      get: "/v1/check/{datasource}"
    };
  }

  // ListWatchTargets lists the rules the watcher keeps in sync: self_heal on,
  // and not suspended. The orchestrator is the one service that layers
  // config.cue, a tenant's bundle.json and a repository's vartrack.json into
  // the rule a sync runs with, so it answers; the watcher asks again on every
  // poll and follows rule changes without a restart.
  rpc ListWatchTargets(google.protobuf.Empty) returns (ListWatchTargetsResponse) {
    option (google.api.http) = {
      get: "/v1/watcher/targets"
    };
  }
}

// ────────────────────────────────────────────
// SyncDatasource
// ────────────────────────────────────────────

message SyncDatasourceRequest {
  // Datasource name in the CUE bundle (e.g. "mongo").
  string datasource = 1 [
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  // Platform name (e.g. "github"). Empty means all platforms for this datasource.
  string platform = 2 [(google.api.field_behavior) = OPTIONAL];

  // Tenant ID; empty means all tenants managed by this rule.
  string tenant = 3 [(google.api.field_behavior) = OPTIONAL];

  // Environment label; empty means all environments.
  string env = 4 [(google.api.field_behavior) = OPTIONAL];

  // Human-readable reason logged by the orchestrator (e.g. "drift detected").
  string reason = 5 [(google.api.field_behavior) = OPTIONAL];
}

message SyncDatasourceResponse {
  // Celery task ID for the enqueued sync job.
  string task_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Brief status (e.g. "accepted").
  string status = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ────────────────────────────────────────────
// CheckDatasource
// ────────────────────────────────────────────

message CheckDatasourceRequest {
  // Datasource name in the CUE bundle (e.g. "mongo").
  string datasource = 1 [
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  // Platform name. Empty means all platforms for this datasource.
  string platform = 2 [(google.api.field_behavior) = OPTIONAL];

  // Tenant ID; empty means every registered tenant.
  string tenant = 3 [(google.api.field_behavior) = OPTIONAL];
}

message CheckDatasourceResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // Every synced environment matches Git.
    STATUS_IN_SYNC = 1;
    // At least one environment differs from Git.
    STATUS_DRIFTED = 2;
    // A sync for this datasource is still running; check again later.
    STATUS_SYNCING = 3;
    // Not comparable: never synced, or the datasource could not be read.
    STATUS_UNKNOWN = 4;
  }

  Status status = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // "{platform}/{datasource}/{env}" of every environment that differs from Git.
  repeated string drifted = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Why the status is what it is, for logs.
  string message = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ────────────────────────────────────────────
// ListWatchTargets
// ────────────────────────────────────────────

// WatchTarget is one rule of one tenant that the watcher checks and heals.
message WatchTarget {
  // Platform name of the rule (e.g. "github").
  string platform = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Datasource name of the rule (e.g. "mongo").
  string datasource = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The tenant whose rule it is.
  string tenant_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListWatchTargetsResponse {
  repeated WatchTarget targets = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}
