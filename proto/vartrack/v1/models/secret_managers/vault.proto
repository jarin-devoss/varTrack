syntax = "proto3";

package vartrack.v1;

import "vartrack/v1/enums/secret_id_type.proto";
import "vartrack/v1/options.proto";
import "vartrack/v1/utils/secret_ref.proto";
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

message VaultConfig {
  // --- Identity ---
  // Optional tag to distinguish multiple instances of the same type.
  // Resolved name: "vault-{tag}" if set, otherwise "vault".
  optional string tag = 1 [(google.api.field_behavior) = OPTIONAL];

  // --- Connection ---
  string endpoint = 2 [
    (buf.validate.field).string.uri = true,
    (google.api.field_behavior) = REQUIRED
  ];

  // Vault Enterprise namespace.
  string namespace = 3 [(google.api.field_behavior) = OPTIONAL];

  // KV engine mount point (e.g. "secret", "kv").
  string mount_point = 4 [
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  // KV engine version: 1 or 2.
  int32 kv_version = 5 [
    (buf.validate.field).int32 = {in: [1, 2]},
    (google.api.field_behavior) = REQUIRED
  ];

  // Where a plain @secret() field is read from: the secret at this path (under
  // the mount point), by the field's own name. A field written as
  // "@secret(mount/path#key)" names its own path and does not use it. The
  // orchestrator reads it; a {ref: {path, key}} always names its path.
  optional string path_prefix = 17 [(google.api.field_behavior) = OPTIONAL];

  // --- Authentication ---
  oneof auth {
    option (buf.validate.oneof).required = true;

    TokenAuth      token_auth      = 6;
    AppRoleAuth    app_role_auth   = 7;
    KubernetesAuth kubernetes_auth = 8;
    UserPassAuth   userpass_auth   = 9;
  }

  // --- TLS ---
  //
  // The server's certificate is always checked unless this is set. It is named for the
  // unsafe choice so that leaving it out is the safe one; it was `verify_ssl`, whose
  // unset value (false) meant "do not check" in the Go services.
  bool            insecure_skip_verify = 40 [(google.api.field_behavior) = OPTIONAL];
  reserved 10;
  reserved "verify_ssl";
  // CA certificate for server verification, as its content (PEM). To give a file, use ssl_ca_file.
  optional string ssl_ca     = 11 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {path_or_content: "content"}
  ];
  // CA certificate for server verification, as the path of a PEM file the service reads.
  optional string ssl_ca_file = 41 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {path_or_content: "path"}
  ];
  // Client certificate content (PEM) for mutual TLS.
  optional string ssl_cert   = 12 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {path_or_content: "content"}
  ];
  // Client private key content (PEM) for mutual TLS.
  optional string ssl_key    = 13 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {path_or_content: "content"}
  ];

  // --- Reliability ---
  // Per-request timeout. Uses google.protobuf.Duration instead of raw int32
  // so callers can express sub-second precision and the intent is unambiguous.
  // Minimum: 1s. Default (zero): no timeout (caller supplies context deadline).
  google.protobuf.Duration timeout     = 14 [
    (buf.validate.field).duration.gte = {seconds: 1},
    (google.api.field_behavior) = OPTIONAL
  ];
  int32 max_retries = 15 [
    (buf.validate.field).int32.gte = 0,
    (google.api.field_behavior) = OPTIONAL
  ];

  // How long to wait before retrying after a failed auth attempt.
  google.protobuf.Duration retry_backoff = 16 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

// --- Auth method messages ---

message TokenAuth {
  // A credential: a string, {file: "/run/secrets/…"} (optionally with key), never a {ref:}: Vault cannot
  // log in with a secret it would first have to read from itself.
  SecretRef token = 1 [(google.api.field_behavior) = REQUIRED];

  // When this token was last successfully used (OUTPUT_ONLY).
  google.protobuf.Timestamp last_used_at = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When this token expires, if known (OUTPUT_ONLY).
  google.protobuf.Timestamp expires_at = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message AppRoleAuth {
  string role_id   = 1 [
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
  // A credential: a string, {file: "/run/secrets/…"} (optionally with key), never a {ref:}: Vault cannot
  // log in with a secret it would first have to read from itself.
  // With secret_id_type ENVIRONMENT its value names the environment variable that holds it.
  SecretRef secret_id = 2 [(google.api.field_behavior) = REQUIRED];

  SecretIDType secret_id_type = 3 [
    (buf.validate.field).enum.defined_only = true,
    (google.api.field_behavior) = OPTIONAL
  ];

  // Mount path for the approle auth method (defaults to "approle").
  string mount_path = 4 [(google.api.field_behavior) = OPTIONAL];

  // When the last successful login occurred (OUTPUT_ONLY).
  google.protobuf.Timestamp last_login_at = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message KubernetesAuth {
  string role = 1 [
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  // Defaults to /var/run/secrets/kubernetes.io/serviceaccount/token.
  string jwt_path   = 2 [(google.api.field_behavior) = OPTIONAL];

  // Mount path for the kubernetes auth method (defaults to "kubernetes").
  string mount_path = 3 [(google.api.field_behavior) = OPTIONAL];
}

message UserPassAuth {
  string username = 1 [
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];
  // A credential: a string, {file: "/run/secrets/…"} (optionally with key), never a {ref:}: Vault cannot
  // log in with a secret it would first have to read from itself.
  SecretRef password = 2 [(google.api.field_behavior) = REQUIRED];

  // Mount path for the userpass auth method (defaults to "userpass").
  string mount_path = 3 [(google.api.field_behavior) = OPTIONAL];
}
