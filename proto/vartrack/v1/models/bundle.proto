syntax = "proto3";

package vartrack.v1;

import "vartrack/v1/models/platform.proto";
import "vartrack/v1/models/datasource.proto";
import "vartrack/v1/models/rule.proto";
import "vartrack/v1/models/schema_registry.proto";
import "vartrack/v1/models/tenant.proto";
import "vartrack/v1/models/secret_manager.proto";
import "vartrack/v1/models/monitoring.proto";
import "vartrack/v1/models/auth/oidc.proto";
import "vartrack/v1/models/ui.proto";
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

message Bundle {
  repeated Platform platforms = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  repeated DataSource datasources = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  repeated Rule rules = 3 [
    (buf.validate.field).repeated.min_items = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  // The one schema repository every rule shares. Optional: a tenant declares its own in tenants[].schema_repo,
  // and the gateway runs without this block (it only says so when a schema push arrives with none).
  SchemaRegistry schema_registry = 4 [(google.api.field_behavior) = OPTIONAL];

  repeated SecretManager secret_managers = 5 [
    (google.api.field_behavior) = OPTIONAL
  ];

  optional Monitoring monitoring = 6 [
    (google.api.field_behavior) = OPTIONAL
  ];

  map<string, string> global_tags = 7 [
    (google.api.field_behavior) = OPTIONAL
  ];

  // When this bundle configuration was last loaded/validated.
  // OUTPUT_ONLY: set by the gateway at startup, not accepted from clients.
  google.protobuf.Timestamp loaded_at = 8 [
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // auth enables the CLI API (/v1/cli/*) with OIDC authentication and RBAC.
  // When absent the CLI routes are disabled and vtctl cannot connect.
  optional AuthConfig auth = 9 [
    (google.api.field_behavior) = OPTIONAL
  ];

  // ── Infrastructure wiring ────────────────────────────────────────────────
  // Each value is the full datasource name ({type}-{tag}) of the datasource
  // that plays that infrastructure role.  Using dedicated fields gives
  // type-safe generated-code access instead of stringly-typed global_tags.
  //
  // Example: celery_broker_datasource = "redis-broker"
  //   resolves to the Redis datasource whose tag == "broker".

  // Name of the Redis datasource used as the Celery task-queue broker.
  string celery_broker_datasource = 10 [
    (google.api.field_behavior) = OPTIONAL
  ];

  // Name of the datasource used as the Celery result backend.
  string celery_backend_datasource = 11 [
    (google.api.field_behavior) = OPTIONAL
  ];

  // Name of the Redis datasource used by the gateway for nonce/replay-protection.
  string gateway_nonce_datasource = 12 [
    (google.api.field_behavior) = OPTIONAL
  ];

  // Field 13 was watcher_state_datasource. The watcher keeps no state between
  // polls (the orchestrator compares with its sync ledger), so nothing read it.
  reserved 13;
  reserved "watcher_state_datasource";

  // Name of the datasource used for watcher leader election.
  // Only Redis and ZooKeeper are supported.
  // When absent all watcher replicas run independently (idempotent, safe).
  string watcher_leader_election_datasource = 14 [
    (google.api.field_behavior) = OPTIONAL
  ];

  // Maximum size of an incoming webhook request body in bytes.
  // Requests exceeding this limit are rejected with HTTP 413.
  // Defaults to 10 MiB (10 * 1024 * 1024) when unset or zero.
  optional uint64 max_webhook_body_bytes = 15 [
    (google.api.field_behavior) = OPTIONAL
  ];

  // ui configures the web UI: where users open it and how they sign in.
  // When absent the UI is open to anyone who can reach it.
  optional UIConfig ui = 16 [
    (google.api.field_behavior) = OPTIONAL
  ];

  // The tenants the operator declares. With none, one implicit tenant "default" covers every
  // repository, so a single-tenant install is unchanged; with any, every tenant of a rule's
  // `tenants` and every push must belong to one of them.
  repeated Tenant tenants = 17 [(google.api.field_behavior) = OPTIONAL];

  // How each orchestrator worker runs. Every value here is a default: the worker's environment
  // (VARTRACK_WORKER_*) and its command line override it. Only the orchestrator's worker reads it.
  optional WorkerConfig workers = 18 [(google.api.field_behavior) = OPTIONAL];

  // Limits on how many syncs write at once to a group of datasources, across all workers. A datasource
  // that no limit names has none. Only the orchestrator's worker reads it.
  repeated SyncLimit sync_limits = 19 [(google.api.field_behavior) = OPTIONAL];
}

message SyncLimit {
  // A name for the limit, shown in the UI, the logs and the metrics.
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // Full datasource names ({type} or {type}-{tag}) that share these slots, such as several datasources
  // that are one server. A datasource is in at most one limit.
  repeated string datasources = 2 [(buf.validate.field).repeated.min_items = 1];

  // Syncs that may write to them at once. At least 1.
  uint32 max_at_once = 3 [(buf.validate.field).uint32.gte = 1];
}

message WorkerConfig {
  // Syncs one worker container runs at once (Celery pool processes), 1 to 64. Default 4.
  optional uint32 concurrency = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 64}];

  // A pool process is replaced after this many syncs, to bound memory growth. 0 means never.
  // Default 200.
  optional uint32 max_tasks_per_child = 2;
}
