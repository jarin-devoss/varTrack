syntax = "proto3";

package vartrack.v1;

import "vartrack/v1/enums/sync_mode.proto";
import "vartrack/v1/options.proto";
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// RepositoryOverride lets a single rule enable/disable itself for a subset
// of repositories matched by name glob.
message RepositoryOverride {
  repeated string match_repositories   = 1 [(google.api.field_behavior) = OPTIONAL];
  repeated string exclude_repositories = 2 [(google.api.field_behavior) = OPTIONAL];
  bool            enable               = 3 [(google.api.field_behavior) = OPTIONAL];
}

// PruneConfig controls how stale keys are removed from the sink.
//
// Prune runs once per environment, after all its files are written and only
// when none failed. A stale key is one varTrack wrote before that no file of
// the environment holds any more; a key varTrack did not write, or one that
// something else changed since, is never deleted.
//
// protection – glob patterns for keys that must never be deleted
//              (e.g. "bootstrap.*", "_schema").
message PruneConfig {
  // Field 1 was `last` (defer deletion until all files were written). Prune
  // now always runs after all of an environment's files, so it has no effect.
  reserved 1;
  reserved "last";

  // enabled = true  → prune is active (equivalent to legacy prune: true)
  // enabled = false → prune is disabled (equivalent to legacy prune: false)
  // A block that only lists protection is not enabled.
  //
  // Field 2 was `dry_run` (delete nothing, only report what would go). That is
  // what a dry run reports for any rule that prunes, and what a rule with
  // prune off does on a sync.
  reserved 2;
  reserved "dry_run";
  bool            enabled    = 4 [(google.api.field_behavior) = OPTIONAL];
  repeated string protection = 3 [(google.api.field_behavior) = OPTIONAL];
}

// SchemaMapping sends the files whose path matches `match` to one CUE schema.
message SchemaMapping {
  // A glob over the file's path in its repository, with forward slashes: `*`
  // stays inside one folder, `**` crosses folders, `?` is one character, and
  // dotfiles match. Case counts.
  string match = 1 [(google.api.field_behavior) = REQUIRED];

  // The schema that checks them: a path inside the tenant's schema repository,
  // ending in `.cue`, or `none` for "not checked, on purpose". No absolute path,
  // no `..`, no backslash.
  string schema = 2 [(google.api.field_behavior) = REQUIRED];
}

// Rule maps a platform and datasource to what is synced and how.
//
// Each option's (vartrack.v1.config) annotation says how it behaves across the
// layers a rule is built from (see options.proto): the orchestrator and the
// gateway derive what merges, what only config.cue sets and what a
// vartrack.json may set from it, so a new option states it here and nowhere else.
message Rule {
  // ── Required ────────────────────────────────────────────────────────────────

  // The platform that sends this rule's pushes: a platforms entry's name,
  // "github", "gitea", or "{type}-{tag}" for a tagged one. With datasource it
  // names the rule: a bundle.json rule layers the config.cue rule with the same
  // platform and datasource, and there is at most one of each pair.
  string platform = 1 [
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  // Where the rule writes: a datasources entry's name, "mongo", "redis", or
  // "{type}-{tag}" for a tagged one ("mongo-billing").
  string datasource = 2 [
    (buf.validate.field).string.min_len = 1,
    (google.api.field_behavior) = REQUIRED
  ];

  // The repositories whose pushes this rule syncs, as "owner/name" glob
  // patterns ("acme/*", "acme/payments-*"). The gateway routes a push by them.
  repeated string repositories = 5 [
    (buf.validate.field).repeated.min_items = 1,
    (google.api.field_behavior) = REQUIRED,
    (vartrack.v1.config) = {settable_in: CONFIG_CUE}
  ];

  // ── Source selection ─────────────────────────────────────────────────────────

  // Explicit single file to track in every repository.
  // Mutually exclusive with file_path_map (validated below).
  optional string file_name = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: VARTRACK_JSON}
  ];

  // Maps environment label → file path for per-env config files.
  // e.g. { "production": "config/prod.json", "staging": "config/staging.json" }
  map<string, string> file_path_map = 11 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {mergeable: true, settable_in: VARTRACK_JSON}
  ];

  // The rule's own branch: it feeds the file_path_map environments, and it is
  // the branch the periodic self-heal compares when the rule has no
  // branch_map (with a branch_map, every branch in it is healed). "main" when
  // unset.
  optional string branch = 31 [
    (google.api.field_behavior) = OPTIONAL
  ];

  // Field 32 was `max_changed_files`, the most files one push synced: it cut the
  // "every file the push changed" fallback of a rule that named no file. A rule
  // names the file it reads now (file_name or file_path_map) and reads only that,
  // so there is nothing to cut. Reserved so the number is never reused.
  reserved 32;
  reserved "max_changed_files";

  // ── root_key ─────────────────────────────────────────────────────────────────
  //
  // Top-level key to extract from the parsed file BEFORE flattening.
  // Only that subtree is written to the sink.
  //
  // Default behaviour (field absent or unset):
  //   → "vartrack" is used as the key.
  //   → If the file contains a "vartrack" key, only that section is synced.
  //   → If "vartrack" is absent, the WHOLE FILE is used (soft fallback).
  //
  // Set to "" to always process the entire file regardless of its contents.
  //
  // Examples:
  //   root_key: "properties"  → sync only the "properties" object
  //   root_key: "vartrack"    → (default) sync "vartrack" section or whole file
  //   root_key: ""            → always sync whole file
  //
  // Works the same way for every supported format (JSON, YAML, TOML, XML,
  // .env, .properties, HCL, INI, JS module): the key is looked up after the
  // file is parsed.
  optional string root_key = 24 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: VARTRACK_JSON}
  ];

  // ── Environment resolution ───────────────────────────────────────────────────

  // The branch name is the environment. Formerly env_as_branch.
  bool branch_as_env = 7  [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: VARTRACK_JSON, old_names: ["env_as_branch"]}
  ];
  // "pr-{number}" is the environment. Formerly env_as_pr.
  bool pr_as_env     = 8  [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: VARTRACK_JSON, old_names: ["env_as_pr"]}
  ];
  // The tag name is the environment. Formerly env_as_tags.
  // The former names are still read from bundles and vartrack.json.
  bool tag_as_env    = 9  [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: VARTRACK_JSON, old_names: ["env_as_tags"]}
  ];

  // Branch → environment, e.g. {main: "production", develop: "staging"}.
  // A push to a branch that is not listed, and that no file_path_map,
  // branch_as_env, pr_as_env or tag_as_env places, feeds no environment of
  // the rule: it is skipped, not written anywhere. There is no "default"
  // environment; a rule has to name where its environments come from (this,
  // file_path_map, branch_as_env, pr_as_env or tag_as_env) in config.cue or the
  // tenant's bundle.json, or it is refused when it is loaded. To keep writing
  // to an environment called default, map a branch to it: {main: "default"}.
  map<string, string> branch_map = 10 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {mergeable: true, settable_in: VARTRACK_JSON}
  ];

  // ── Sink / merge options ─────────────────────────────────────────────────────

  // The secret manager (a secret_managers entry: "vault" or "vault-{tag}")
  // that {ref: …} credentials of this rule's platform and datasource, and its
  // @secret() fields, are read from. Unset: the entry tagged "default", else
  // the bundle's only one.
  optional string secret_manager  = 3  [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: CONFIG_CUE}
  ];
  // Universal storage path / key / name template for the sink.
  // Supported placeholders: {tenant}, {env}
  //
  // Sink        Interpretation               Example
  // ──────────  ───────────────────────────  ──────────────────────────────────
  // zookeeper   znode root path              "/{tenant}/{env}"  → /acme/pr-42
  // s3          S3 key prefix                "{tenant}/{env}"   → acme/pr-42/config.json
  // redis       key prefix                   "{tenant}:{env}"   → acme:pr-42:vartrack
  // mongo       collection name              "{env}-config"     → pr-42-config
  // linux       full file path               "/etc/app/{env}/config.env"
  // helm        release name                 "app-{env}"        → app-pr-42
  // configmap   ConfigMap name               "myapp-{env}"      → myapp-pr-42
  //
  // When not set each sink falls back to its own sink-specific config key.
  string destination_template     = 12 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {old_names: ["zk_path_template"]}
  ];
  // Renames of flat keys before they are written: {"NEW_NAME": "path.in.file"}
  // writes the value at path.in.file under NEW_NAME.
  map<string, string> variables_map = 13 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {mergeable: true, settable_in: VARTRACK_JSON}
  ];
  // How a sync writes. AUTO (the default) uses GIT_UPSERT_ALL for a file of
  // up to 500 keys and GIT_SMART_REPAIR above. GIT_UPSERT_ALL writes every
  // key. GIT_SMART_REPAIR reads what the sink holds and writes only what
  // differs, by content: the changed keys in Redis, ZooKeeper and MongoDB
  // key-value, and in a sink that holds the file as one object (a MongoDB
  // document, an S3 object, a file, a ConfigMap, a Helm values file or
  // release) the whole file, or nothing when it already holds the file. If the
  // sink cannot be read, every key is written. The proto names
  // (SYNC_MODE_AUTO, ...) are read too. Any other value is refused.
  SyncMode sync_mode              = 14 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).enum.defined_only = true,
    (vartrack.v1.config) = {settable_in: VARTRACK_JSON}
  ];

  // Field 21 was: apply_strategy (ApplyStrategy). Always CLIENT_SIDE — removed.
  reserved 21;
  reserved "apply_strategy";

  // ── Repository filtering ─────────────────────────────────────────────────────

  // Repositories (glob patterns) this rule skips although repositories
  // matches them.
  repeated string exclude_repositories  = 6  [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: CONFIG_CUE}
  ];
  // Turns the rule on or off for some repositories:
  // [{match_repositories: ["other-org/*"], enable: true}].
  repeated RepositoryOverride overrides = 15 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: CONFIG_CUE}
  ];

  // ── Pruning ──────────────────────────────────────────────────────────────────
  // Structured prune config — replaces the old flat bool fields.
  // prune.protection → glob patterns that are never pruned

  // Delete keys varTrack wrote before that Git no longer holds: true, or
  // {enabled, protection}. Prune runs once per environment after all
  // its files are written, only on sinks that keep each key separately (Redis,
  // ZooKeeper, MongoDB with STRATEGY_KEY_VALUE). A key changed outside
  // varTrack is kept and reported. protection lists glob patterns of keys that
  // are never deleted; every layer's patterns add up. An object with only
  // protection does not turn pruning on.
  PruneConfig prune = 16 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {mergeable: true, settable_in: VARTRACK_JSON}
  ];

  // Field numbers 17–19 were: prune_last, prune_protection, dry_run_prune.
  // They are now encoded inside PruneConfig (field 16). Reserved for wire safety.
  reserved 17, 18, 19;
  reserved "prune_last", "prune_protection", "dry_run_prune";

  // ── Dry-run mode ──────────────────────────────────────────────────────────────
  //
  // A dry run is something a person starts, never a setting of a rule: the UI's
  // Dry run, `vt sync --dry-run`, the dry-run webhook. It runs the whole
  // pipeline — @secret fields are fetched and masked as "***" in the report —
  // and skips the sink write. Field 25 was `dry_run`, a rule that never wrote
  // (a "shadow rule"); a rule is now always a rule, and CI checks a change with
  // `vt sync --dry-run`.
  reserved 25;
  reserved "dry_run";

  // ── Self-heal / scheduling ───────────────────────────────────────────────────

  // The watcher compares the datasource with Git on every poll and, on drift,
  // has the orchestrator write Git's values back.
  bool self_heal = 20 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: CONFIG_CUE}
  ];

  // Field 22 was retry_backoff, which nothing read; the retry_backoff settings
  // that exist belong to the Linux server and the Vault configs.
  reserved 22;
  reserved "retry_backoff";

  // ── Layering ─────────────────────────────────────────────────────────────────

  // Rule keys pinned by this bundle. The orchestrator builds the rule it syncs
  // with in layers, each overriding the one before: this rule, the schema
  // repo's bundle.json rule for the same platform and datasource, the repo's
  // vartrack.json, and last these keys, e.g. force: {prune: {enabled: false}}.
  // Keys only the bundle sets (connection settings, secrets, repositories,
  // self_heal, ...) are not needed here and are ignored.
  google.protobuf.Struct force = 26 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: CONFIG_CUE}
  ];

  // ── Ownership, pausing, drift ────────────────────────────────────────────────

  // The tenants whose bundle.json may layer this rule: any tenant when empty.
  // When no tenant's bundle.json names the rule, the first one owns it
  // ("default" when empty).
  repeated string tenants = 27 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: CONFIG_CUE}
  ];

  // Pauses automatic syncs: pushes and self-heal skip the rule, while syncs
  // started by hand (web UI, vt) still run, so a pause does not block a
  // deliberate sync.
  bool suspend = 28 [(google.api.field_behavior) = OPTIONAL];

  // Keys (glob patterns) a drift check does not compare: keys the
  // application changes itself.
  repeated string drift_ignore = 29 [(google.api.field_behavior) = OPTIONAL];

  // ── Validation ───────────────────────────────────────────────────────────────

  // A file the CUE schema rejects fails the sync instead of being written with
  // a warning. Without it a failed validation is logged and the file is still
  // synced.
  bool strict_validation = 30 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: VARTRACK_JSON}
  ];

  // Which schema checks which file, by the file's path in its repository: the
  // first entry whose `match` matches the path wins. Without a match the schema
  // is found by the file's name (`<name>.cue`, then `default.cue`) as before.
  // A schema the map names that is not in the schema repository fails the file,
  // with or without strict_validation. The layers add up, config.cue's entries
  // first, so a path the operator mapped cannot be remapped by a tenant.
  repeated SchemaMapping schema_map = 50 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: BUNDLE_JSON}
  ];

  // Let a JSON, YAML or TOML file name its own schema with a top-level
  // `$schema` key, when no schema_map entry matched its path (the map wins, and
  // the file's result says so). The value has the syntax of a schema_map
  // `schema`; a URL (an editor's hint) is ignored. `$schema` is never synced as
  // a key, whether this is on or not.
  bool schema_from_file = 51 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: BUNDLE_JSON}
  ];

  // ── Identity the layers may state ────────────────────────────────────────────

  // HTTPS clone URL of the config repository. Left out, it is derived from the
  // platform and the rule's only repository.
  string repo_url = 48 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: BUNDLE_JSON}
  ];

  // Field 49 was tenant_id. The tenant is where a file lives, never something it says: it is the
  // tenant whose schema repository holds the bundle.json that layers the rule, and a file that
  // could name its own tenant could act as another one. varTrack keeps its own record of it on the
  // rule it builds (the orchestrator's "tenant_id" key); it is not an option, so no file sets it.
  reserved 49;
  reserved "tenant_id";

  // ── Sink options a tenant may set ────────────────────────────────────────────
  //
  // Formatting choices a sink makes that no datasource block carries. They change
  // how values are laid out in the destination, never where it is or how to
  // reach it, so a tenant's bundle.json may set them. Everything that locates or
  // reaches a destination (hosts, credentials, paths, binaries, flags) is a
  // datasource field, which only config.cue sets.

  // How a nested key is flattened into a flat destination key: "dot", "flat", …
  string key_format = 40 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: BUNDLE_JSON}
  ];

  // Linux server: the format the file is written in. Left out, the file's extension.
  string file_format = 41 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: BUNDLE_JSON}
  ];

  // Linux server: one file per environment, named after it. True when left out.
  optional bool env_as_filename = 42 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: BUNDLE_JSON}
  ];

  // Helm: how values reach the chart, "set" (--set flags) or "file".
  string helm_values_mode = 43 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: BUNDLE_JSON}
  ];

  // S3: tags put on every object written.
  map<string, string> s3_object_tags = 44 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: BUNDLE_JSON}
  ];

  // S3: keys whose values become object tags.
  repeated string s3_tag_keys = 45 [
    (google.api.field_behavior) = OPTIONAL,
    (vartrack.v1.config) = {settable_in: BUNDLE_JSON}
  ];

  reserved 46;
  reserved "vercel_sensitive_keys";

  // ── Metadata (output only) ───────────────────────────────────────────────────

  google.protobuf.Timestamp last_applied_at = 23 [(google.api.field_behavior) = OUTPUT_ONLY];

  // ── Validation constraints ───────────────────────────────────────────────────

  option (buf.validate.message).cel = {
    id: "rule.scan_target",
    message: "Provide either 'file_name' or 'file_path_map'",
    expression: "has(this.file_name) || this.file_path_map.size() > 0"
  };

  option (buf.validate.message).cel = {
    id: "rule.destination_template_env_requirement",
    message: "destination_template uses {env} but no environment strategy is enabled",
    expression:
      "!this.destination_template.contains('{env}') || "
      "(this.branch_as_env || this.pr_as_env || this.tag_as_env || "
      "this.branch_map.size() > 0 || this.file_path_map.size() > 0)"
  };
}
