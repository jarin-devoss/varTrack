[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-service"
version = "0.2.0"
description = "VarTrack Orchestrator – GitOps ETL pipeline with CUE schema validation"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.164.0",
    "uvicorn[standard]>=0.54.0",
    "gunicorn>=27.0.1",

    # Celery
    "celery[redis]>=5.7.0",
    "kombu>=5.7.0",

    # MongoDB
    "pymongo>=4.18.3",

    # ZooKeeper
    "kazoo>=2.11.0",

    # SSH (linux_server sink — SSHClient for config deployment to Linux targets)
    "paramiko>=5.1.0",

    # S3 sink
    "boto3>=1.44.5",

    # Vault secret resolver (hvac is the official HashiCorp Vault Python client)
    "hvac>=2.0",

    # Git
    "gitpython>=3.2.1",

    # Parsing
    "PyYAML>=6",
    # tomllib is stdlib in Python 3.11+; tomli is the backport
    "tomli>=2.0; python_version < '3.11'",
    # TOML is read with tomllib; this writes it, for a FILE sink that keeps or converts a file (app/parsers/formats.py)
    "tomli-w>=1.0",
    # Safe XML parsing (defusedxml protects against XML bomb / XXE attacks)
    "defusedxml>=0.7",

    # HCL parsing (Terraform .tf, .hcl) — required for correct parsing of
    # nested blocks. Without this, hcl_parser.py silently falls back to the
    # KV parser which mishandles nested HCL structures.
    "python-hcl2>=8.2.0",

    # Observability
    "structlog>=26.1.0",
    "prometheus-client>=0.26.0",
    # OpenTelemetry SDK + exporters + auto-instrumentation
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-celery>=0.45b0",
    "opentelemetry-instrumentation-grpc>=0.45b0",

    # Utils
    "python-dateutil>=4.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
# Celery task monitor (Flower and its web server, Tornado). Not in the image or the locks: a monitor
# nothing starts there. Install with: pip install -e ".[monitoring]"
monitoring = [
    "flower>=2.2.0",
]
# Runtime test dependencies — install with: pip install -e ".[test]"
test = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.27",
]
# Linting / type-checking tools — install with: pip install -e ".[dev]"
# In practice, local development installs both: pip install -e ".[test,dev]"
dev = [
    "orchestrator-service[test]",
    "ruff>=0.17.5",
    "mypy>=2.4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "F401"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
exclude = ["^app/generated/"]  # buf generate output
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "app.tls",
    "app.monitoring.prometheus",
    "app.monitoring.elk",
    "app.monitoring.otel",
    "app.pipeline.sinks",
    "app.pipeline.sinks.redis",
    "app.pipeline.sinks.mongo",
    "app.pipeline.sinks.linux_server",
    "app.pipeline.stage_etl",
    "app.grpc_server.server",
    "app.schema_registry.manager",
    "app.pipeline.schema_utils",
    "app.pipeline.validator",
    "app.monitoring.app",
    "app.api.app",
    "app.parsers.hcl_parser",
]
ignore_errors = true
